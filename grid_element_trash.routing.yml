admin.config.grid.boxtrash:
  path: 'admin/config/grid/boxtrash'
  defaults:
    _form: '\Drupal\grid_element_trash\Form\BoxForm'
    _title: Box Trash
  requirements:
    _permission: administer grid

admin.config.grid.containertrash:
  path: 'admin/config/grid/containertrash'
  defaults:
    _form: '\Drupal\grid_element_trash\Form\ContainerForm'
    _title: Container Trash
  requirements:
    _permission: administer grid

grid_element_trash.reusable_box.trash:
  path: 'admin/config/grid/boxes/{id}/trash'
  defaults:
    _form: '\Drupal\grid_element_trash\Form\ReusableBoxTrashForm'
    _title: Put Box to Trash
  requirements:
    _permission: administer grid

grid_element_trash.reusable_container.trash:
  path: 'admin/config/grid/container/{id}/trash'
  defaults:
    _form: '\Drupal\grid_element_trash\Form\ReusableContainerTrashForm'
    _title: Put Container to Trash
  requirements:
    _permission: administer grid
